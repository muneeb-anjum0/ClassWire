name: Quality, security, and build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Guard repository contents
        run: python tools/repository_guard.py

      - name: Verify backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip install -r backend/requirements-dev.txt
          pip-audit -r backend/requirements.txt --progress-spinner off
          python -m pytest --cov=backend --cov-report=term-missing
          python tools/verify_nlu_runtime.py --max-peak-rss-mib 192

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify and build frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run test:coverage
          npm run build
